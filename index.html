<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-widht, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Meu BLOG</title>
</head>
<body>
 <header>
    <h1>Meu blog</h1>
<p>Naiara Wansowski schlemmer</p>
<p>vou compartilhar com você a minha vida pessoal</p>
 </header> 
 <main>
    <h2>Meu primeiro Post</h2>
    <p>Boas vindas ao meu blog</p>
    <img src="https://mmurad.com.br/blog/vida-pessoal-e-profissional-equilibrio/"
    alt="blog e vida pessoal">
    <button>😍<span>0</span></button>
 </main>  
</body>
<script>
    const botoes = document.querySeletorALL("button");
    botoes.forEach(function(botao){
        botao.addEventListener("click", botaoclicado);
        function botaoclicado(){
            let texto = botao.querySeletor("span");
            texto.textContent++;
        }
    })
</script>
</html>
